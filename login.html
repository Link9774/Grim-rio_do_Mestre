<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="Css/cadastro.css">
</head>

<body>
    <div class="container">
    
        <h1>Entrar</h1>
    
        <p class="subtitle">
            O Grimório aguarda seu retorno, Mestre.
        </p>
        
        <hr>

        <form id="loginForm">
            <div class="formGroup">
                <label>Email</label>
                <input
                type="email"
                id="loginEmail"
                placeholder="Digite seu email"                
                >
            
            </div>
            
            <div class="formGrup">
                <label>Senha</label>

                <input
                type="password"
                id ="loginPassword"
                placeholder="Digite sua senha"
                >
            </div>
            <button type="submit">
                Entrar
            </button>
        
        </form>
    
    </div>
    <script src="Scripts/login.js"></script>
</body>
</html>
